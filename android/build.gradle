buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.9.1"
    }
}

apply plugin: "com.android.library"

group = "br.com.jylabtech.getnet_payment_tech"
version = "1.0"

android {
    namespace "br.com.jylabtech.getnet_payment_tech"
    compileSdk 36

    defaultConfig {
        minSdk 22
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig false
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs project.file('libs')
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    testImplementation "junit:junit:4.13.2"
    // Classes do SDK Getnet (o app inclui o AAR) para instanciar a implementação nativa nos testes JVM
    testImplementation files(zipTree(project.file('libs/libposdigital-1.8.1-13-release.aar')).matching { include 'classes.jar' })
}
